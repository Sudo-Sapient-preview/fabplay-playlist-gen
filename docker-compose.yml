services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - fabplay_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8001
    ports:
      - "8003:8003"
    depends_on:
      - backend

volumes:
  fabplay_data: