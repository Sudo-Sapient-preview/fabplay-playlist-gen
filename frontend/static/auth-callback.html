<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying — Brandbeat</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.0.20/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.0.20/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.0.20/index.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bone:        #F2EEE5;
    --black:       #0A0A0A;
    --penguin-red: #B8451F;
    --slate:       #5A5550;
    --hairline:    #C5BFB5;
    --font-display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --font-label:  'Inter Variable', 'Inter', system-ui, sans-serif;
  }

  html, body { min-height: 100vh; -webkit-font-smoothing: antialiased; }

  body {
    font-family: var(--font-label);
    background: var(--bone);
    color: var(--black);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px 24px;
  }

  .wm {
    font-family: var(--font-display);
    font-weight: 600;
    line-height: 1;
    display: inline-flex;
    align-items: baseline;
    text-decoration: none;
    margin-bottom: 8px;
  }
  .wm-b    { font-size: 48px; color: var(--penguin-red); letter-spacing: -0.05em; margin-right: 3px; line-height: 1; }
  .wm-rest { font-size: 34px; color: var(--black); letter-spacing: -0.04em; line-height: 1; }

  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--hairline);
    border-top-color: var(--penguin-red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .msg {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--black);
    text-align: center;
  }

  .sub {
    font-family: var(--font-label);
    font-size: 14px;
    font-weight: 500;
    color: var(--slate);
    text-align: center;
    max-width: 320px;
    line-height: 1.6;
  }

  .sub.err {
    color: var(--penguin-red);
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--penguin-red);
    background: transparent;
    border-radius: 4px;
    padding: 12px 16px;
    font-family: var(--font-display);
    font-size: 16px;
  }

  a {
    color: var(--penguin-red);
    text-decoration: underline;
    text-underline-offset: 0.3em;
    text-decoration-thickness: 1px;
    font-weight: 500;
  }
  a:hover { color: var(--black); }
</style>
</head>
<body>

<a href="/" class="wm" aria-label="Brandbeat home">
  <span class="wm-b">b</span><span class="wm-rest">randbeat</span>
</a>
<div class="spinner" id="spinner"></div>
<p class="msg" id="msg">Verifying your account.</p>
<p class="sub" id="sub">Please wait a moment.</p>

<script>
(async function () {
  const msgEl  = document.getElementById('msg');
  const subEl  = document.getElementById('sub');
  const spinEl = document.getElementById('spinner');

  function showError(text) {
    spinEl.style.display = 'none';
    msgEl.textContent = 'Verification failed.';
    subEl.innerHTML = text + ' <a href="/login">Back to sign in</a>';
    subEl.classList.add('err');
  }

  function storeSession(access_token, refresh_token) {
    localStorage.setItem('fabplay_token',   access_token);
    localStorage.setItem('fabplay_refresh',  refresh_token || '');
    document.cookie = 'fabplay_session=1; path=/; SameSite=Strict';
  }

  // ── 1. Hash-based flow (#access_token=...&type=signup)
  if (window.location.hash) {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const access_token  = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    const type          = params.get('type');

    if (access_token) {
      msgEl.textContent = 'Email confirmed.';
      subEl.textContent = 'Redirecting…';
      if (type === 'recovery') {
        storeSession(access_token, refresh_token);
        setTimeout(() => { window.location.href = '/dashboard'; }, 800);
      } else {
        setTimeout(() => { window.location.href = '/login?confirmed=true'; }, 800);
      }
      return;
    }

    const error_desc = params.get('error_description');
    if (error_desc) { showError(decodeURIComponent(error_desc)); return; }
  }

  // ── 2. PKCE code flow (?code=...)
  const code = new URLSearchParams(window.location.search).get('code');
  if (code) {
    try {
      const cfg = await fetch('/api/config').then(r => r.json());
      const r = await fetch(cfg.supabase_url + '/auth/v1/token?grant_type=pkce', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': cfg.supabase_anon_key },
        body: JSON.stringify({ auth_code: code })
      });
      const data = await r.json();
      if (!r.ok) { showError(data.error_description || 'Could not verify.'); return; }
      msgEl.textContent = 'Email confirmed.';
      subEl.textContent = 'Redirecting to sign in…';
      setTimeout(() => { window.location.href = '/login?confirmed=true'; }, 800);
    } catch(e) {
      showError('Connection error during verification.');
    }
    return;
  }

  showError('No verification token found in this link.');
})();
</script>
</body>
</html>
