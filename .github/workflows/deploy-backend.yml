name: Deploy Backend

on:
  push:
    branches: [fabplay-v1]
    paths:
      - 'backend/**'
      - 'pipeline/**'
      - 'brand_pipeline/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deployment zip
        run: |
          python3 -c "
          import zipfile, os
          skip = {'__pycache__'}
          with zipfile.ZipFile('backend_deploy.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              zf.write('requirements.txt', 'requirements.txt')
              for folder in ['backend', 'pipeline', 'brand_pipeline']:
                  if os.path.isdir(folder):
                      for root, dirs, files in os.walk(folder):
                          dirs[:] = [d for d in dirs if d not in skip]
                          for f in files:
                              fp = os.path.join(root, f)
                              zf.write(fp, fp.replace(os.sep, '/'))
          print('Backend zip ready')
          "

      - name: Deploy to Azure Web App
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
        run: |
          USER=$(echo "$PUBLISH_PROFILE" | python3 -c "import sys,re; m=re.search(r'userName=\"([^\"]+)\"', sys.stdin.read()); print(m.group(1))")
          PASS=$(echo "$PUBLISH_PROFILE" | python3 -c "import sys,re; m=re.search(r'userPWD=\"([^\"]+)\"', sys.stdin.read()); print(m.group(1))")
          curl -f --max-time 300 -X POST \
            "https://${USER}:${PASS}@fabplay-v1-backend.scm.azurewebsites.net/api/zipdeploy" \
            --data-binary @backend_deploy.zip \
            -H "Content-Type: application/octet-stream"
